- name: Install Android SDK
  shell: bash
  run: |
    set -eux

    mkdir -p "$ANDROID_HOME"
    mkdir -p "$ANDROID_HOME/cmdline-tools"

    cd /tmp
    curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
    unzip -q -o cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
    rm -rf "$ANDROID_HOME/cmdline-tools/latest"
    mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"

    yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true

    "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --install \
      "platform-tools" \
      "platforms;android-34" \
      "build-tools;34.0.0"
